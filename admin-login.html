<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | CONFETTINCAKE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <script>
        // If the admin is already logged in, skip this page and go straight to dashboard
        if(localStorage.getItem('isAdminLoggedIn') === 'true') {
            window.location.href = 'private/admin-dashboard.html';
        }
    </script>

    <style>
        :root { --bg-cream: #FFF7EA; --text-dark: #1A1A1A; --accent-color: #FF6B81; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background-color: var(--bg-cream); color: var(--text-dark);
            height: 100vh; display: flex; justify-content: center; align-items: center; 
        }

        .login-box {
            background: #fff; padding: 40px 30px; border-radius: 12px; width: 90%; max-width: 380px; 
            text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            border-top: 4px solid var(--text-dark);
        }

        .login-box h2 { font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 5px; }
        .login-box p { color: #666; font-size: 0.9rem; margin-bottom: 25px; }

        input {
            width: 100%; padding: 14px 0; margin-bottom: 20px; border: none;
            border-bottom: 2px solid #EAEAEA; outline: none; font-size: 1rem;
            transition: 0.3s; text-align: center; letter-spacing: 2px;
        }
        input:focus { border-bottom: 2px solid var(--accent-color); }

        button {
            width: 100%; padding: 15px; border: none; border-radius: 6px;
            background: var(--text-dark); color: white; cursor: pointer; 
            font-size: 1rem; font-weight: 600; text-transform: uppercase; transition: 0.3s;
        }
        button:hover { background: var(--accent-color); }

        #error-msg { display: none; color: #D9534F; margin-top: 15px; font-size: 0.85rem; font-weight: 600;}
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Admin Portal</h2>
        <p>Authorized personnel only.</p>
        
        <input type="password" id="adminPass" placeholder="Enter Master Password">
        <button onclick="verifyAdmin()">Access Backend</button>
        <p id="error-msg">Incorrect password. Access denied.</p>
    </div>

    <script>
        async function verifyAdmin() {
            const enteredPass = document.getElementById('adminPass').value;
            const errorMsg = document.getElementById('errorMsg');
            
            try {
                // Fetch the real password from the SQLite database
                const response = await fetch('/api/settings');
                const settings = await response.json();
                const correctPass = settings.adminPass || 'cake'; // Default fallback

                if(enteredPass === correctPass) {
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    window.location.href = 'private/admin-dashboard.html'; 
                } else {
                    errorMsg.innerText = "Incorrect Password";
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.innerText = "Cannot connect to database.";
                errorMsg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
