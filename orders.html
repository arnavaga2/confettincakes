<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | CONFETTINCAKE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-cream: #FFF7EA; --text-dark: #1A1A1A; --accent-color: #FF6B81; --card-bg: #FFFFFF; --success: #48BB78; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { font-family: 'Poppins', sans-serif; background-color: var(--bg-cream); color: var(--text-dark); overflow-x: hidden; }

        /* HEADER */
        header { position: sticky; top: 0; width: 100%; padding: 15px 20px; background: rgba(255, 247, 234, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 9000; display: flex; align-items: center; }
        .back-btn { font-size: 1.5rem; text-decoration: none; color: var(--text-dark); width: 40px; }
        .page-title { font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; color: var(--accent-color); font-weight: 700; flex-grow: 1; text-align: center; padding-right: 40px;}

        main { max-width: 800px; margin: 0 auto; min-height: 100vh; padding-bottom: 50px; }

        /* TABS */
        .tabs { display: flex; background: var(--card-bg); padding: 0 10px; position: sticky; top: 58px; z-index: 8900; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .tab { flex: 1; text-align: center; padding: 15px 0; font-size: 0.95rem; font-weight: 600; color: #A0AEC0; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s; }
        .tab.active { color: var(--accent-color); border-bottom: 3px solid var(--accent-color); }

        .tab-content { display: none; padding: 20px; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ORDER CARDS */
        .order-card { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); border: 1px solid #EAEAEA; }
        .order-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px dashed #E2E8F0; padding-bottom: 15px; margin-bottom: 15px; }
        .order-id { font-size: 0.85rem; color: #718096; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .order-date { font-size: 0.75rem; color: #A0AEC0; margin-top: 4px; }
        .order-total { font-size: 1.1rem; font-weight: 700; color: var(--text-dark); }

        .item-list { margin-bottom: 15px; }
        .item-row { display: flex; justify-content: space-between; font-size: 0.9rem; color: #4A5568; margin-bottom: 6px; }
        .item-row span:first-child { font-weight: 600; }

        /* 🔥 SWIGGY-STYLE LIVE TRACKER */
        .tracker-container { background: #F7FAFC; border-radius: 12px; padding: 20px; margin-top: 15px; border: 1px solid #E2E8F0; }
        .tracker-title { font-size: 0.85rem; font-weight: 700; color: var(--text-dark); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        
        .timeline { position: relative; padding-left: 25px; }
        .timeline::before { content: ''; position: absolute; left: 7px; top: 5px; bottom: 5px; width: 2px; background: #E2E8F0; border-radius: 2px; }
        
        .step { position: relative; margin-bottom: 20px; }
        .step:last-child { margin-bottom: 0; }
        
        .step-dot { position: absolute; left: -25px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #E2E8F0; border: 3px solid #F7FAFC; z-index: 2; transition: 0.4s; }
        .step-text { font-size: 0.9rem; font-weight: 600; color: #A0AEC0; transition: 0.4s; }
        .step-subtext { font-size: 0.75rem; color: #A0AEC0; margin-top: 2px; }

        /* Tracker Active States */
        .step.completed .step-dot { background: var(--success); }
        .step.completed .step-text { color: var(--text-dark); }
        
        .step.active .step-dot { background: var(--accent-color); box-shadow: 0 0 0 3px rgba(255, 107, 129, 0.2); animation: pulse 2s infinite; }
        .step.active .step-text { color: var(--accent-color); }
        
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 107, 129, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(255, 107, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 107, 129, 0); } }

        /* BADGES FOR PAST ORDERS */
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; text-transform: uppercase; font-weight: 700; }
        .s-delivered { background: #F0FFF4; color: #2F855A; }
        .s-canceled { background: #FFF5F5; color: #C53030; }

        /* EMPTY STATE */
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-icon { font-size: 4rem; margin-bottom: 15px; opacity: 0.5; filter: grayscale(100%); }
        .empty-text { font-size: 1.1rem; color: #718096; font-weight: 600; margin-bottom: 20px; }
        .shop-btn { background: var(--accent-color); color: white; border: none; padding: 12px 30px; border-radius: 30px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; text-decoration: none; display: inline-block; box-shadow: 0 5px 15px rgba(255, 107, 129, 0.3); }

    </style>
</head>
<body>

    <header>
        <a href="index.html" class="back-btn">←</a>
        <h2 class="page-title">My Orders</h2>
    </header>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('active', this)">Live Tracking</div>
        <div class="tab" onclick="switchTab('past', this)">Past Orders</div>
    </div>

    <main>
        <div id="tab-active" class="tab-content active">
            <div id="active-orders-container">
                <div class="empty-state" style="display:none;">
                    <div class="empty-icon">🍩</div>
                    <p class="empty-text">You have no active orders right now.</p>
                    <a href="menu.html" class="shop-btn">Craving Something?</a>
                </div>
            </div>
        </div>

        <div id="tab-past" class="tab-content">
            <div id="past-orders-container">
                <div class="empty-state" style="display:none;">
                    <div class="empty-icon">📦</div>
                    <p class="empty-text">Your order history is empty.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Check Auth
        const activeUser = JSON.parse(localStorage.getItem('confettinActiveUser'));
        if(!activeUser) {
            window.location.replace('index.html'); // Send back to login if not logged in
        }

        // Tab Switcher
        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
        }

        // Fetch user orders from Backend
        async function fetchMyOrders() {
            try {
                // We send the user's phone number to get their specific orders
                // *Note: You'll need to make sure this API route exists in server.js!*
                const response = await fetch(`/api/my-orders?phone=${activeUser.phone}`);
                
                if (response.ok) {
                    const orders = await response.json();
                    renderOrders(orders);
                } else {
                    showEmptyStates();
                }
            } catch (err) {
                console.error("Could not fetch orders:", err);
                showEmptyStates();
            }
        }

        function showEmptyStates() {
            document.querySelector('#active-orders-container .empty-state').style.display = 'block';
            document.querySelector('#past-orders-container .empty-state').style.display = 'block';
        }

        function renderOrders(orders) {
            const activeContainer = document.getElementById('active-orders-container');
            const pastContainer = document.getElementById('past-orders-container');
            
            // Clear loading placeholders
            activeContainer.innerHTML = '';
            pastContainer.innerHTML = '';

            let activeCount = 0;
            let pastCount = 0;

            // Reverse to show newest first
            orders.reverse().forEach(order => {
                
                // Parse items safely
                let itemsListHtml = '';
                try {
                    const items = JSON.parse(order.items);
                    items.forEach(item => {
                        itemsListHtml += `<div class="item-row"><span>${item.qty}x ${item.name}</span></div>`;
                    });
                } catch(e) { itemsListHtml = `<div class="item-row"><span>Custom Bakery Order</span></div>`; }

                // SORTING LOGIC
                if (['pending', 'baking', 'out'].includes(order.status.toLowerCase())) {
                    // It's an ACTIVE order
                    activeCount++;
                    activeContainer.innerHTML += buildActiveOrderHTML(order, itemsListHtml);
                } else {
                    // It's a PAST order (delivered or canceled)
                    pastCount++;
                    pastContainer.innerHTML += buildPastOrderHTML(order, itemsListHtml);
                }
            });

            // Handle empty states if no orders exist in a category
            if(activeCount === 0) activeContainer.innerHTML = `<div class="empty-state"><div class="empty-icon">🍩</div><p class="empty-text">You have no active orders right now.</p><a href="menu.html" class="shop-btn">Craving Something?</a></div>`;
            if(pastCount === 0) pastContainer.innerHTML = `<div class="empty-state"><div class="empty-icon">📦</div><p class="empty-text">Your order history is empty.</p></div>`;
        }

        // --- SWIGGY TRACKER BUILDER ---
        function buildActiveOrderHTML(order, itemsHtml) {
            const status = order.status.toLowerCase();
            
            // Determine active step logic
            let s1 = '', s2 = '', s3 = '';
            
            if (status === 'pending') { s1 = 'active'; }
            if (status === 'baking')  { s1 = 'completed'; s2 = 'active'; }
            if (status === 'out')     { s1 = 'completed'; s2 = 'completed'; s3 = 'active'; }

            return `
            <div class="order-card">
                <div class="order-header">
                    <div>
                        <div class="order-id">Order #${order.id}</div>
                        <div class="order-date">Placed today</div>
                    </div>
                    <div class="order-total">${order.total}</div>
                </div>
                
                <div class="item-list">${itemsHtml}</div>
                
                <div class="tracker-container">
                    <div class="tracker-title">Live Tracking</div>
                    <div class="timeline">
                        <div class="step ${s1}">
                            <div class="step-dot"></div>
                            <div class="step-text">Order Received</div>
                            <div class="step-subtext">We are reviewing your request.</div>
                        </div>
                        <div class="step ${s2}">
                            <div class="step-dot"></div>
                            <div class="step-text">Baking in Progress</div>
                            <div class="step-subtext">The chef is preparing your treats.</div>
                        </div>
                        <div class="step ${s3}">
                            <div class="step-dot"></div>
                            <div class="step-text">Out for Delivery</div>
                            <div class="step-subtext">Your order is on the way!</div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        // --- PAST ORDER BUILDER ---
        function buildPastOrderHTML(order, itemsHtml) {
            const isDelivered = order.status.toLowerCase() === 'delivered';
            const badgeClass = isDelivered ? 's-delivered' : 's-canceled';
            const statusText = isDelivered ? 'Delivered' : 'Canceled';

            return `
            <div class="order-card">
                <div class="order-header">
                    <div>
                        <div class="order-id">Order #${order.id}</div>
                        <div class="order-date">${order.date}</div>
                    </div>
                    <div><span class="status-badge ${badgeClass}">${statusText}</span></div>
                </div>
                <div class="item-list">${itemsHtml}</div>
                <div style="text-align: right; margin-top: 10px; font-weight: 700; color: var(--text-dark);">Total: ${order.total}</div>
            </div>`;
        }

        window.onload = fetchMyOrders;
    </script>
</body>
</html>
