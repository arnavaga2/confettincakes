<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | CONFETTINCAKE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --bg-cream: #FFF7EA; --text-dark: #1A1A1A; --accent-color: #FF6B81; --card-bg: #FFFFFF; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-cream); color: var(--text-dark); }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }

        header { position: fixed; top: 0; left: 0; width: 100%; padding: 15px 20px; background: rgba(255, 247, 234, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,0,0,0.05); z-index: 9000; display: flex; align-items: center; justify-content: space-between; }
        .back-btn { font-size: 1.5rem; text-decoration: none; color: var(--text-dark); width: 40px; }
        .page-title { font-size: 1.2rem; letter-spacing: 3px; text-transform: uppercase; color: var(--accent-color); margin: 0; flex-grow: 1; text-align: center; padding-right: 40px; font-weight: 600;}

        main { padding: 90px 20px 120px; max-width: 600px; margin: 0 auto; }

        .cart-item { display: flex; align-items: center; background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #EAEAEA;}
        .item-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; margin-right: 15px; }
        .item-details { flex-grow: 1; }
        .item-name { font-size: 1rem; font-weight: 600; color: var(--text-dark); margin-bottom: 5px;}
        .item-price { color: var(--accent-color); font-weight: 600; font-size: 0.9rem;}
        
        .qty-controls { display: flex; align-items: center; gap: 10px; background: #F7FAFC; padding: 5px 10px; border-radius: 8px; border: 1px solid #E2E8F0;}
        .qty-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-dark); font-weight: 600; padding: 0 5px;}
        .qty-num { font-size: 0.95rem; font-weight: 600; width: 20px; text-align: center;}

        .summary-box { background: var(--card-bg); padding: 25px; border-radius: 16px; margin-top: 30px; box-shadow: 0 8px 25px rgba(0,0,0,0.05); border: 1px solid #EAEAEA;}
        
        /* PROMO STYLING */
        .promo-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .promo-row input { flex-grow: 1; padding: 12px; border: 1px solid #E2E8F0; border-radius: 8px; font-family: 'Poppins'; text-transform: uppercase; outline: none; }
        .promo-row input:focus { border-color: var(--accent-color); }
        .promo-row button { padding: 0 20px; background: var(--text-dark); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .promo-msg { font-size: 0.85rem; color: #48BB78; margin-top: -15px; margin-bottom: 15px; font-weight: 600; display: none; }

        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; color: #4A5568;}
        .summary-row.discount-row { color: #48BB78; font-weight: 600; }
        .summary-total { display: flex; justify-content: space-between; margin-top: 15px; padding-top: 15px; border-top: 2px dashed #E2E8F0; font-size: 1.2rem; font-weight: 600; color: var(--text-dark);}

        .checkout-btn { width: 100%; padding: 18px; border: none; border-radius: 12px; background: var(--text-dark); color: white; font-size: 1.1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; margin-top: 25px; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.1);}
        .checkout-btn:hover { background: var(--accent-color); transform: translateY(-3px);}

        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-state h3 { font-size: 1.5rem; margin-bottom: 10px; }
        .empty-state p { color: #718096; margin-bottom: 25px; }
        .shop-btn { background: var(--accent-color); color: white; text-decoration: none; padding: 12px 30px; border-radius: 25px; font-weight: 600; }

        #toast { position: fixed; bottom: -50px; left: 50%; transform: translateX(-50%); background: #E53E3E; color: white; padding: 12px 25px; border-radius: 30px; font-weight: 600; transition: 0.4s; z-index: 10000; opacity: 0; }
        #toast.show { bottom: 40px; opacity: 1; }
    </style>
</head>
<body>

    <header>
        <a href="menu.html" class="back-btn">←</a>
        <h2 class="page-title">Shopping Cart</h2>
    </header>

    <main id="cart-container">
        </main>

    <div id="toast">Message</div>

    <script>
        let cart = JSON.parse(localStorage.getItem('confettinCart')) || [];
        const DELIVERY_FEE = 40;
        
        // New Promo Variables
        let appliedPromo = { code: "", discountPct: 0 }; 

        function renderCart() {
            const container = document.getElementById('cart-container');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 4rem; margin-bottom: 15px;">🛒</div>
                        <h3>Your cart is empty</h3>
                        <p>Looks like you haven't added any treats yet.</p>
                        <a href="menu.html" class="shop-btn">Explore Menu</a>
                    </div>
                `;
                return;
            }

            let cartHTML = '';
            let subtotal = 0;

            cart.forEach((item, index) => {
                subtotal += (item.price * item.qty);
                cartHTML += `
                    <div class="cart-item">
                        <img src="${item.img}" class="item-img">
                        <div class="item-details">
                            <h4 class="item-name">${item.name}</h4>
                            <p class="item-price">₹${item.price}</p>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                            <span class="qty-num">${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                        </div>
                    </div>
                `;
            });

            // MATH FOR PROMO CODES
            let discountAmount = 0;
            if (appliedPromo.discountPct > 0) {
                discountAmount = Math.round(subtotal * (appliedPromo.discountPct / 100));
            }
            const total = (subtotal - discountAmount) + DELIVERY_FEE;

            // Generate Summary HTML
            cartHTML += `
                <div class="summary-box">
                    
                    <div class="promo-row">
                        <input type="text" id="promo-input" placeholder="Have a promo code?" value="${appliedPromo.code}">
                        <button onclick="checkPromo()">Apply</button>
                    </div>
                    <div id="promo-msg" class="promo-msg"></div>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>₹${subtotal}</span>
                    </div>
                    
                    ${appliedPromo.discountPct > 0 ? `
                    <div class="summary-row discount-row">
                        <span>Discount (${appliedPromo.code})</span>
                        <span>- ₹${discountAmount}</span>
                    </div>` : ''}

                    <div class="summary-row">
                        <span>Delivery Fee</span>
                        <span>₹${DELIVERY_FEE}</span>
                    </div>
                    <div class="summary-total">
                        <span>Total to Pay</span>
                        <span style="color: var(--accent-color);">₹${total}</span>
                    </div>
                    <button class="checkout-btn" onclick="processCheckout(${total})">Proceed to Pay</button>
                </div>
            `;

            container.innerHTML = cartHTML;
            
            if(appliedPromo.discountPct > 0) {
                const msgBox = document.getElementById('promo-msg');
                msgBox.innerText = `✅ ${appliedPromo.discountPct}% Discount Applied!`;
                msgBox.style.display = 'block';
            }
        }

        // --- VALIDATE PROMO VIA SQLITE API ---
        async function checkPromo() {
            const inputCode = document.getElementById('promo-input').value;
            if(!inputCode) return;

            try {
                const res = await fetch('/api/promos/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: inputCode })
                });
                
                const data = await res.json();

                if (res.ok) {
                    appliedPromo = { code: inputCode.toUpperCase(), discountPct: data.discount };
                    renderCart(); // Re-render to calculate math
                } else {
                    appliedPromo = { code: "", discountPct: 0 };
                    renderCart(); 
                    showToast(data.error); // E.g., "Invalid or expired promo code"
                }
            } catch (err) {
                showToast("Server connection error");
            }
        }

        function updateQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            localStorage.setItem('confettinCart', JSON.stringify(cart));
            renderCart();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message; toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function processCheckout(finalTotal) {
            const activeUser = JSON.parse(localStorage.getItem('confettinActiveUser'));
            if (!activeUser) {
                showToast("Please log in from the home page to place an order!");
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
                return;
            }
            // Save the discounted total and jump to the payment page
            localStorage.setItem('confettinCheckoutTotal', finalTotal);
            window.location.href = 'payment.html';
        }

        window.onload = renderCart;
    </script>
</body>
</html>
